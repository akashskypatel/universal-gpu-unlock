name: GPU discovery and gated active preparation verification
on:
  push:
    branches: [main]
    paths:
      - 'src/gpu_topology*'
      - 'src/gpu_prom_capture*'
      - 'tests/test_gpu_prom_capture.c'
      - 'src/gpu_loaded_pe_text*'
      - 'tests/test_gpu_loaded_pe_text.c'
      - 'src/gpu_inventory*'
      - 'src/gpu_discovery*'
      - 'src/Gpu-Selection-Build.ps1'
      - 'src/Build-Experimental-MSVC.ps1'
      - 'src/Build-Dxe-Driver.ps1'
      - 'src/port.h'
      - 'src/app.c'
      - 'src/profile.c'
      - 'Setup-AdaUnlock.ps1'
      - 'Check-GPU-Unlock.bat'
      - 'README.md'
      - 'src/dxe_main.c'
      - 'tests/test_gpu_discovery.c'
      - 'src/gpu_pci_observation*'
      - 'tests/gpu_pci_observation_mock.h'
      - 'tests/test_gpu_pci_observation.c'
      - 'src/gpu_windows_*'
      - 'tests/test_gpu_windows_*'
      - 'tests/gpu_windows_handoff_mock.h'
      - 'src/Build-Gpu-Topology-Diagnostic.ps1'
      - 'tests/test_gpu_topology.c'
      - '.github/workflows/gpu-topology-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize persistent activity log before checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gu-log"
          {
            echo "event=${GITHUB_EVENT_NAME} repo=${GITHUB_REPOSITORY} sha=${GITHUB_SHA} ref=${GITHUB_REF} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            date -u
            uname -a
            gcc --version | head -n 1
            clang --version | head -n 1
          } > "$RUNNER_TEMP/gu-log/host.log" 2>&1
      - uses: actions/checkout@v4
      - name: Compile and execute bounded host tests
        shell: bash
        run: |
          set -euo pipefail
          (
            trap 'rc=$?; echo "HOST_EXIT=$rc"; git status --short; df -h .; exit "$rc"' EXIT
            for compiler in gcc clang; do
              "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_loaded_pe_text.c src/gpu_loaded_pe_text.c -o "$RUNNER_TEMP/test_gpu_loaded_pe_text_$compiler"
              "$RUNNER_TEMP/test_gpu_loaded_pe_text_$compiler"
            done
            gcc -std=c11 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_loaded_pe_text.c src/gpu_loaded_pe_text.c -o "$RUNNER_TEMP/test_gpu_loaded_pe_text_ubsan"
            "$RUNNER_TEMP/test_gpu_loaded_pe_text_ubsan"
            # Original 1-MiB PROM reader: host callbacks only. The EFI adapter
            # is compile-only and never linked into the topology diagnostic.
            for compiler in gcc clang; do
              "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_prom_capture.c src/gpu_prom_capture.c -o "$RUNNER_TEMP/test_gpu_prom_capture_$compiler"
              "$RUNNER_TEMP/test_gpu_prom_capture_$compiler"
            done
            gcc -std=c11 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_prom_capture.c src/gpu_prom_capture.c -o "$RUNNER_TEMP/test_gpu_prom_capture_ubsan"
            "$RUNNER_TEMP/test_gpu_prom_capture_ubsan"
            gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_topology.c src/gpu_topology.c src/gpu_inventory.c -o "$RUNNER_TEMP/test_gpu_topology"
            "$RUNNER_TEMP/test_gpu_topology"
            clang -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_topology.c src/gpu_topology.c src/gpu_inventory.c -o "$RUNNER_TEMP/test_gpu_topology_clang"
            "$RUNNER_TEMP/test_gpu_topology_clang"
            gcc -std=c11 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_topology.c src/gpu_topology.c src/gpu_inventory.c -o "$RUNNER_TEMP/test_gpu_topology_ubsan"
            "$RUNNER_TEMP/test_gpu_topology_ubsan"
            gcc -std=c11 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_inventory.c src/gpu_inventory.c -o "$RUNNER_TEMP/test_gpu_inventory_ubsan"
            "$RUNNER_TEMP/test_gpu_inventory_ubsan"
            # Parse the Python half of the hybrid batch script without CUDA.
            python3 -c 'from pathlib import Path; s=Path("Check-GPU-Unlock.bat").read_text(encoding="utf-8"); parts=s.split(chr(39)*3,2); assert len(parts)==3; compile(parts[2], "Check-GPU-Unlock.bat", "exec"); print("PASS benchmark Python syntax (no CUDA execution)")'
            # The real discovery entrypoint must reject selected active EFI
            # builds before GuInit even on one or three GPUs.
            mkdir -p "$RUNNER_TEMP/active-selected"
            printf '#define GU_GPU_SELECTION_COUNT 2U\n#define GU_GPU_SELECTION_LOCATIONS { { 1U,7U,4U,1U }, { 0U,3U,0U,0U } }\n' > "$RUNNER_TEMP/active-selected/gpu-selection.h"
            for compiler in gcc clang; do
              "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -DGU_ACTIVE_SEQUENCE_PREPARE_ONLY -I"$RUNNER_TEMP/active-selected" -Isrc tests/test_gpu_discovery.c src/gpu_inventory.c -o "$RUNNER_TEMP/test_active_preparation_$compiler"
              "$RUNNER_TEMP/test_active_preparation_$compiler"
            done
            # Also exercise the selected-build guard when the machine has
            # exactly one GPU, not merely a missing second requested target.
            printf '#define GU_GPU_SELECTION_COUNT 1U\n#define GU_GPU_SELECTION_LOCATIONS { { 0U,3U,0U,0U } }\n' > "$RUNNER_TEMP/active-selected/gpu-selection.h"
            for compiler in gcc clang; do
              "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -DGU_ACTIVE_SEQUENCE_PREPARE_ONLY -I"$RUNNER_TEMP/active-selected" -Isrc tests/test_gpu_discovery.c src/gpu_inventory.c -o "$RUNNER_TEMP/test_active_preparation_single_$compiler"
              "$RUNNER_TEMP/test_active_preparation_single_$compiler"
            done
            for compiler in gcc clang; do
              for test in gpu_inventory gpu_discovery; do
                "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Isrc "tests/test_${test}.c" src/gpu_inventory.c -o "$RUNNER_TEMP/test_${test}_${compiler}"
                "$RUNNER_TEMP/test_${test}_${compiler}"
              done
            done
            for compiler in gcc clang; do
              "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -Isrc tests/test_gpu_windows_path.c src/gpu_windows_path.c -o "$RUNNER_TEMP/test_gpu_windows_path_$compiler"
              "$RUNNER_TEMP/test_gpu_windows_path_$compiler"
              "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -fshort-wchar -DGU_GPU_DIAGNOSTIC_ONLY -DGU_TOPO_WINDOWS_HANDOFF -DGU_TOPO_SAVE_LOG -DGU_WINDOWS_HANDOFF_HOST_TEST -Isrc tests/test_gpu_windows_handoff.c src/gpu_windows_handoff.c src/gpu_windows_path.c -o "$RUNNER_TEMP/test_gpu_windows_handoff_$compiler"
              "$RUNNER_TEMP/test_gpu_windows_handoff_$compiler"
            done
            for compiler in gcc clang; do
              "$compiler" -std=c11 -O2 -Wall -Wextra -Werror -pedantic -DGU_GPU_DIAGNOSTIC_ONLY -DGU_PCI_OBSERVATION_HOST_TEST -Isrc tests/test_gpu_pci_observation.c src/gpu_pci_observation.c -o "$RUNNER_TEMP/test_gpu_pci_observation_$compiler"
              "$RUNNER_TEMP/test_gpu_pci_observation_$compiler"
            done
            gcc -std=c11 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -pedantic -DGU_GPU_DIAGNOSTIC_ONLY -DGU_PCI_OBSERVATION_HOST_TEST -Isrc tests/test_gpu_pci_observation.c src/gpu_pci_observation.c -o "$RUNNER_TEMP/test_gpu_pci_observation_ubsan"
            "$RUNNER_TEMP/test_gpu_pci_observation_ubsan"
            gcc -std=c11 -O1 -g -fsanitize=undefined -fno-sanitize-recover=all -Wall -Wextra -Werror -pedantic -fshort-wchar -DGU_GPU_DIAGNOSTIC_ONLY -DGU_TOPO_WINDOWS_HANDOFF -DGU_TOPO_SAVE_LOG -DGU_WINDOWS_HANDOFF_HOST_TEST -Isrc tests/test_gpu_windows_handoff.c src/gpu_windows_handoff.c src/gpu_windows_path.c -o "$RUNNER_TEMP/test_gpu_windows_handoff_ubsan"
            "$RUNNER_TEMP/test_gpu_windows_handoff_ubsan"
          ) 2>&1 | tee -a "$RUNNER_TEMP/gu-log/host.log"
      - name: Preserve final host status
        if: always()
        shell: bash
        run: |
          { echo "final_utc=$(date -u +%FT%TZ)"; git status --short || true; } >> "$RUNNER_TEMP/gu-log/host.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-topology-host-activity-${{ github.run_id }}
          path: ${{ runner.temp }}/gu-log/host.log
          if-no-files-found: error
  efi:
    runs-on: windows-latest
    steps:
      - name: Initialize persistent EFI build log before checkout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\gu-log" | Out-Null
          @("event=$env:GITHUB_EVENT_NAME sha=$env:GITHUB_SHA ref=$env:GITHUB_REF run=$env:GITHUB_RUN_ID", "utc=$((Get-Date).ToUniversalTime().ToString('o'))", "host=$env:RUNNER_OS", "powershell=$($PSVersionTable.PSVersion)") | Out-File -Encoding utf8 "$env:RUNNER_TEMP\gu-log\efi.log"
      - uses: actions/checkout@v4
      - name: Compile isolated diagnostic EFI with MSVC
        shell: pwsh
        run: |
          try {
            $ErrorActionPreference='Stop'
            # Synthetic, non-deployable partition GUID: compile coverage only.
            & .\src\Build-Gpu-Topology-Diagnostic.ps1 -SaveLog -WindowsEspGuid '12345678-1234-4234-8234-123456789abc' *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            if($LASTEXITCODE -and $LASTEXITCODE -ne 0) {throw "MSVC handoff variant failed: $LASTEXITCODE"}
            'HANDOFF_COMPILE_EXIT=0 SYNTHETIC_WINDOWS_ESP_GUID=1 NOT_FOR_DEPLOYMENT=1' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            # Restore ordinary console-only output for the uploaded artifact.
            & .\src\Build-Gpu-Topology-Diagnostic.ps1 -SaveLog *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            if($LASTEXITCODE -and $LASTEXITCODE -ne 0) {throw "MSVC failed: $LASTEXITCODE"}
            if(-not (Test-Path .\src\build_diagnostic\GPU-TOPOLOGY-DIAGNOSTIC.EFI)){throw 'EFI missing'}
            & .\src\Build-Gpu-Topology-Diagnostic.ps1 -SaveLog -SelectionBdf '0000:09:02.0' *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            if($LASTEXITCODE -and $LASTEXITCODE -ne 0) {throw "MSVC synthetic BDF A diagnostic failed: $LASTEXITCODE"}
            if(-not (Test-Path .\src\build_diagnostic\GPU-SELECTION-0000-09-02-0-DIAGNOSTIC.EFI)){throw 'PCI BDF A selection EFI missing'}
            & .\src\Build-Gpu-Topology-Diagnostic.ps1 -SaveLog -SelectionBdf '0001:2A:03.1' *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            if($LASTEXITCODE -and $LASTEXITCODE -ne 0) {throw "MSVC synthetic BDF B diagnostic failed: $LASTEXITCODE"}
            if(-not (Test-Path .\src\build_diagnostic\GPU-SELECTION-0001-2A-03-1-DIAGNOSTIC.EFI)){throw 'PCI BDF B selection EFI missing'}
            & .\src\Build-Gpu-Topology-Diagnostic.ps1 -SaveLog -SelectionBdfs '0000:09:02.0,0001:2A:03.1' *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            if($LASTEXITCODE -and $LASTEXITCODE -ne 0) {throw "MSVC ordered dual selection EFI failed: $LASTEXITCODE"}
            if(-not (Test-Path .\src\build_diagnostic\GPU-SELECTION-0000-09-02-0--0001-2A-03-1-DIAGNOSTIC.EFI)){throw 'Ordered dual selection EFI missing'}
            # A malformed/duplicate target list must be rejected before compilation.
            $duplicateRejected = $false
            try {
              & .\src\Build-Gpu-Topology-Diagnostic.ps1 -SaveLog -SelectionBdfs '0000:09:02.0,0000:09:02.0' *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            } catch {
              $duplicateRejected = $_.Exception.Message -match 'Duplicate PCI target'
            }
            if(-not $duplicateRejected) {throw 'Duplicate target build was not rejected'}
            'DUPLICATE_SELECTION_REJECTED=1' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            # The legacy auto-installer must refuse before elevation or
            # disk/NVRAM work, even in a noninteractive invocation.
            $setupResult = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Setup-AdaUnlock.ps1 -NonInteractive
            if($LASTEXITCODE -ne 2 -or ($setupResult -join ' ') -notmatch 'STATUS=REFUSED') {
              throw 'Legacy setup must refuse before any mutation'
            }
            'LEGACY_AUTO_SETUP=REFUSED DISK_ACTION=NONE NVRAM_ACTION=NONE' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            # The shipped builders must refuse an unselected legacy active
            # image before compilation, not quietly emit a mutating binary.
            $unsafeAppRejected = $false
            try { & .\src\Build-Experimental-MSVC.ps1 } catch {
              $unsafeAppRejected = $_.Exception.Message -match 'Active firmware build refused'
            }
            if(-not $unsafeAppRejected) { throw 'Unselected active app builder must fail closed' }
            $unsafeDxeRejected = $false
            try { & .\src\Build-Dxe-Driver.ps1 } catch {
              $unsafeDxeRejected = $_.Exception.Message -match 'Active firmware build refused'
            }
            if(-not $unsafeDxeRejected) { throw 'Unselected DXE builder must fail closed' }
            'UNSELECTED_ACTIVE_BUILDS=REFUSED BEFORE_COMPILATION=1' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            # Real active app/DXE sources compile with preparation-only guard.
            & .\src\Build-Experimental-MSVC.ps1 -SelectionBdfs '0000:09:02.0,0001:2A:03.1' *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            if($LASTEXITCODE -and $LASTEXITCODE -ne 0) {throw "Active app prep compilation failed: $LASTEXITCODE"}
            if(-not (Test-Path .\src\build\GPU-ACTIVE-PREP-0000-09-02-0--0001-2A-03-1.EFI)){throw 'Active app preparation EFI missing'}
            & .\src\Build-Dxe-Driver.ps1 -SelectionBdfs '0000:09:02.0,0001:2A:03.1' *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            if($LASTEXITCODE -and $LASTEXITCODE -ne 0) {throw "Active DXE prep compilation failed: $LASTEXITCODE"}
            if(-not (Test-Path .\src\build_dxe\GPU-ACTIVE-PREP-DXE-0000-09-02-0--0001-2A-03-1.efi)){throw 'Active DXE preparation EFI missing'}
            . .\src\Gpu-Selection-Build.ps1
            $more = New-GuGpuSelectionSpec -SelectionBdfs '0000:09:02.0,0001:2A:03.1,0000:0A:04.0' -OutputDirectory $env:RUNNER_TEMP
            & .\src\Build-Gpu-Topology-Diagnostic.ps1 -SaveLog -SelectionBdfs '0000:09:02.0,0001:2A:03.1,0000:0A:04.0' *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\gu-log\efi.log" -Append
            if($LASTEXITCODE -and $LASTEXITCODE -ne 0) {throw "MSVC three-target diagnostic build failed: $LASTEXITCODE"}
            if(-not (Get-ChildItem .\src\build_diagnostic\GPU-SELECTION-N3-*-DIAGNOSTIC.EFI -ErrorAction SilentlyContinue)){throw 'Three-target diagnostic EFI missing'}
            'THREE_TARGET_EFI_COMPILE=PASS READ_ONLY=1' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            if($more.Count -ne 3 -or $more.Label -notmatch '^N3-[0-9A-F]{12}$') {throw 'N-GPU selection validation failed'}
            'MULTI_TARGET_3_BDF_SPEC=PASS MAX_TARGETS=16 PREPARATION_ONLY=1' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            'ACTIVE_APP_DXE_PREP_COMPILE_EXIT=0 GU_PREFLIGHT_ONLY=1 MULTI_NVIDIA_MUTATION=REFUSED' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            'SELECTION_EFI_COMPILE_EXIT=0 ACTIVE_ENTRYPOINTS_COMPILED=1 READ_ONLY=1' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            'BUILD_EXIT=0' | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
          } catch {
            "BUILD_EXIT=1 $($_.Exception.Message)" | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
            throw
          }
      - name: Preserve final EFI status
        if: always()
        shell: pwsh
        run: |
          "final_utc=$((Get-Date).ToUniversalTime().ToString('o'))" | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
          git status --short 2>&1 | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
          Get-PSDrive -PSProvider FileSystem | Format-Table | Out-String | Out-File -Append "$env:RUNNER_TEMP\gu-log\efi.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-topology-efi-activity-${{ github.run_id }}
          path: ${{ runner.temp }}/gu-log/efi.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpu-topology-diagnostic-unsigned-${{ github.sha }}
          path: src/build_diagnostic/GPU-TOPOLOGY-DIAGNOSTIC.EFI
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpu-discovery-selection-unsigned-${{ github.sha }}
          path: src/build_diagnostic/GPU-SELECTION-*-DIAGNOSTIC.EFI
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gpu-active-preparation-unsigned-${{ github.sha }}
          path: |
            src/build/GPU-ACTIVE-PREP-*.EFI
            src/build_dxe/GPU-ACTIVE-PREP-DXE-*.efi
          if-no-files-found: error
